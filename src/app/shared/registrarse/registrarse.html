<div class="flex items-center justify-center min-h-screen px-4 py-12 bg-stone-100 relative overflow-hidden font-sans">

    <div class="absolute top-0 right-0 w-96 h-96 rounded-full pointer-events-none -translate-y-1/2 translate-x-1/3 opacity-20 bg-emerald-500 blur-3xl"></div>
    <div class="absolute bottom-0 left-0 w-80 h-80 rounded-full pointer-events-none translate-y-1/2 -translate-x-1/3 opacity-20 bg-green-600 blur-3xl"></div>

    <div class="flex w-full max-w-sm mx-auto overflow-hidden bg-white rounded-[2rem] shadow-2xl lg:max-w-4xl border border-stone-200">

        <div class="w-full px-8 py-10 md:px-12 lg:w-1/2 bg-white">

            <div class="text-center mb-10">
                <div class="inline-flex items-center gap-2.5 mb-4 group cursor-default">
                    <div class="w-10 h-10 rounded-xl bg-emerald-700 flex items-center justify-center shadow-lg shadow-emerald-200 transition-transform group-hover:scale-110">
                        <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M4 19.5A2.5 2.5 0 016.5 17H20" />
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z" />
                        </svg>
                    </div>
                    <span class="text-2xl font-bold tracking-tight text-stone-800">Ander<span class="text-emerald-600">Lib</span></span>
                </div>
                <h2 class="text-2xl font-bold text-stone-800 tracking-tight">Crea tu cuenta</h2>
                <p class="text-stone-500 text-sm mt-2">Únete a nuestra comunidad de lectores</p>
            </div>

            <form (ngSubmit)="registrarUsuario()" #regForm="ngForm" class="space-y-5">

                <div class="space-y-1">
                    <label class="block text-[10px] font-bold uppercase tracking-[0.15em] text-stone-500 ml-1">Nombre Completo</label>
                    <div class="relative group">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-stone-400 group-focus-within:text-emerald-600 transition-colors">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0" />
                            </svg>
                        </span>
                        <input [(ngModel)]="nuevoUsuario.nombre" name="nombre" type="text" required
                            placeholder="Anderson Guabil" 
                            class="w-full pl-12 pr-4 py-3.5 bg-stone-50 border border-stone-200 rounded-2xl text-sm focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 outline-none transition-all" />
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="block text-[10px] font-bold uppercase tracking-[0.15em] text-stone-500 ml-1">Correo Electrónico</label>
                    <div class="relative group">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-stone-400 group-focus-within:text-emerald-600 transition-colors">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
                            </svg>
                        </span>
                        <input [(ngModel)]="nuevoUsuario.correo" name="correo" type="email" required
                            placeholder="ejemplo@correo.com"
                            class="w-full pl-12 pr-4 py-3.5 bg-stone-50 border border-stone-200 rounded-2xl text-sm focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 outline-none transition-all" />
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="block text-[10px] font-bold uppercase tracking-[0.15em] text-stone-500 ml-1">Contraseña</label>
                    <div class="relative group">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-stone-400 group-focus-within:text-emerald-600 transition-colors">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                            </svg>
                        </span>
                        <input [(ngModel)]="nuevoUsuario.contrasena" name="contrasena" type="password" required
                            placeholder="••••••••••••"
                            class="w-full pl-12 pr-4 py-3.5 bg-stone-50 border border-stone-200 rounded-2xl text-sm focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 outline-none transition-all" />
                    </div>
                </div>

                <button type="submit" 
                    [disabled]="!regForm.form.valid"
                    class="w-full flex items-center justify-center gap-3 mt-4 px-6 py-4 bg-emerald-700 text-white rounded-2xl font-bold text-sm shadow-xl shadow-emerald-900/20 hover:bg-emerald-800 hover:-translate-y-1 active:translate-y-0 disabled:opacity-50 disabled:hover:translate-y-0 transition-all duration-300 cursor-pointer">
                    Registrarse
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 8.25L21 12m0 0l-3.75 3.75M21 12H3" />
                    </svg>
                </button>
            </form>

            <div class="relative my-8">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-stone-200"></div></div>
                <div class="relative flex justify-center text-xs uppercase"><span class="bg-white px-2 text-stone-400 font-medium tracking-tighter">¿Ya tienes cuenta?</span></div>
            </div>

            <button routerLink="/iniciarSesion" 
               class="flex items-center justify-center w-full py-3.5 rounded-2xl border-2 border-stone-100 text-stone-700 font-bold text-sm hover:bg-stone-50 hover:border-emerald-100 transition-all text-center">
                Iniciar Sesión
            </button>
        </div>

        <div class="hidden lg:block lg:w-1/2 relative">
            <img src="https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&w=1000&q=80" 
                 class="absolute inset-0 w-full h-full object-cover" alt="Library">
            <div class="absolute inset-0 bg-gradient-to-tr from-stone-900/90 via-stone-900/70 to-emerald-900/40 backdrop-blur-[1px]"></div>
            
            <div class="absolute inset-0 flex flex-col justify-center px-12 text-white">
                <h3 class="text-4xl font-bold leading-tight">“La lectura es a la mente lo que el ejercicio al cuerpo.”</h3>
                <p class="mt-4 text-emerald-200 font-light italic">— Joseph Addison</p>
                
                
            </div>
        </div>
    </div>
</div>
